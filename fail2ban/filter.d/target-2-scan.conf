# fail2ban filter: nginx 429/400/404 in the ACCESS log — Target-2 variant
# Installed on Target-2 as /etc/fail2ban/filter.d/target-2-scan.conf
#
# Pattern aligned with Target-1 (fail2ban/filter.d/nginx-ratelimit-access.conf),
# which was already proven: 3,732 lines matched out of 4,671. On Target-2:
# 1,723 lines matched out of 1,954.
#
# Why Target-2 needs this: before the change, Target-2 had only the sshd jail —
# no HTTP protection at all. Internet scanners hunted for credential files
# (/.env, /.git/config, AI-agent credential paths) with nothing blocking them.
# Wazuh alerts 31101/31151 piled up in the hundreds in a single day.
#
# Does NOT count static assets (ignoreregex) so that ordinary 404s from a
# browser are not counted. Tested: 21 of 1,954 lines were excluded.
#
# PITFALL: do not build the pattern from negated bracket classes ([^\\[] /
# [^\\]]) around the date block — that breaks <HOST> expansion and the filter
# matches ZERO lines with no error. Use .* in the header area.

[Definition]

failregex = ^<HOST> - - \[[^\]]*\] "[^"]*" (429|400|404) \d+ "[^"]*" "[^"]*"\s*$

ignoreregex = ^<HOST> - - \[[^\]]*\] "[^"]*\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|map|webp) HTTP/[0-9.]+" 404

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}

# No journalmatch: this filter reads a FILE, not the systemd journal.
