# fail2ban filter: nginx rate limit + burst errors from a single IP.
# Installed on the VPS (VPS_IP) as /etc/fail2ban/filter.d/nginx-ratelimit.conf
# NOT deployed automatically by CI/CD — reference/backup only.
#
# Log source: /var/log/nginx/access.log
#   IMPORTANT: that file holds ALL vhosts (there is no per-vhost log), so this
#   filter cannot tell requests for monitor/status/wazuh/etc apart.
#
# Pattern read: 429 (nginx rate limit hit) AND 400/404 (scan, malformed request).
# 400/404 are included because the rate limit itself only triggers after a fast
# burst; a slow scanner still has to be caught by its errors.
# Lines with 200/302 from legitimate users simply do not match — normal, not a problem.
#
# Tested with `fail2ban-regex /var/log/nginx/access.log <filter>`:
#   2658 of 4715 lines matched. The non-matching ones are 200/302 from real users.
#
# PITFALL: this filter ONLY works when the jail uses `backend = auto`.
#   This VPS has jail.d/defaults-debian.conf with `backend = systemd`, and the
#   systemd backend CANNOT read a file log — the jail will look active but never
#   ban anyone. See fail2ban/jail.local in this repo.

[Definition]

failregex = ^<HOST> - - \[[^\]]*\] "[^"]*" (429|400|404) \d+ "[^"]*" "[^"]*"\s*$

ignoreregex =

datepattern = ^%%Y/%%m/%%d
