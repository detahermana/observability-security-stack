# fail2ban filter: nginx 429/400/404 in the ACCESS log — Target-1 variant
# Installed on Target-1 as /etc/fail2ban/filter.d/nginx-ratelimit-access.conf
# NOT deployed automatically by CI/CD — reference/backup only.
#
# ---------------------------------------------------------------------------
# HISTORY: why this version replaced the old one
# ---------------------------------------------------------------------------
# The first version (2026-09-21) was meant to catch the nginx rate limit:
#
#     failregex = ^<HOST> - - .* 429 [0-9]+
#
# That was TOO NARROW and provably failed. A scanner sent 2,408 requests, ALL
# answered 404 (hunting for .env files with the %2e trick:
# /backend/config/mailjet%2eenv). Its rate was only 1-3 rps, far below the
# 20 r/s rate limit, so it NEVER hit a 429 — and the filter never saw it as a
# suspect. Result: `Currently banned: 0` in status while 2,408 requests came in,
# and Wazuh alert 31151 fired 175 times from that one IP (68% of all that day's alerts).
#
# This filter was aligned with the pattern already proven on the VPS
# (/etc/fail2ban/filter.d/nginx-ratelimit.conf, 32 total bans):
#
#     failregex = ^<HOST> - - \[[^\]]*\] "[^"]*" (429|400|404) \d+ "[^"]*" "[^"]*"\s*$
#
# Test on Target-1: 3,732 lines matched out of 4,671 (64 excluded). The old
# filter would have matched only the 429 lines in that log.
#
# ---------------------------------------------------------------------------
# ignoreregex: static assets
# ---------------------------------------------------------------------------
# A 404 on a static asset is normal — browsers and crawlers request files that
# do not exist. Without this exclusion, one page with many broken references
# could count toward a ban and lock out a legitimate visitor.
#
# Tested: 64 of 4,671 lines matched this ignoreregex.
#
# ---------------------------------------------------------------------------
# PITFALL (cost real time — do not repeat)
# ---------------------------------------------------------------------------
# Do NOT build the pattern from negated bracket classes like [^\\[] / [^\\]]
# around the date block. That breaks fail2ban's <HOST> expansion and the filter
# silently matches ZERO lines (verified: 0 of 2090 lines, while the equivalent
# pattern using .* matched all). Use .* in the header area.
#
# Access log format (combined):
#   HOST - - [date] "GET / HTTP/1.1" 429 173 "-" "curl/8.14.1"
#
# Note: this filter also matches 404, but does NOT touch the site's own networks
# because the jail's `ignoreip` contains 192.0.2.0/24, 198.51.100.0/24, and
# 203.0.113.0/24. See jail.d/nginx-ratelimit.local.

[Definition]

failregex = ^<HOST> - - \[[^\]]*\] "[^"]*" (429|400|404) \d+ "[^"]*" "[^"]*"\s*$

ignoreregex = ^<HOST> - - \[[^\]]*\] "[^"]*\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|map|webp) HTTP/[0-9.]+" 404

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}

# No journalmatch: this filter reads a FILE, not the systemd journal.
