# The `http {}` block of the VPS (VPS_IP) nginx.conf — only the parts that matter
# to this repo.
#
# The full file lives at /etc/nginx/nginx.conf on the VPS. This is NOT a complete
# copy (the real one still carries Debian's stock comments, not worth storing in
# a repo), only the sections holding our custom configuration.
#
# NOT deployed automatically by CI/CD — reference/backup only.
#
# ============================================================================
# HOW TO RESTORE after a VPS rebuild
# ============================================================================
# 1. Edit /etc/nginx/nginx.conf, insert the two limit_req_zone/limit_conn_zone
#    lines inside the `http {` block (at the top is fine, before `## Basic Settings`).
# 2. Copy nginx/sites/*.conf from this repo into /etc/nginx/sites-available/,
#    then symlink them into sites-enabled/:
#       sudo ln -sf /etc/nginx/sites-available/<name> /etc/nginx/sites-enabled/<name>
#    IMPORTANT: the file name in sites-available does NOT match the domain name.
#    Names used on the VPS: monitor, status, wazuh, 9router, ujk, app-d.example.net
#    (so the repo uses sites/monitoring.conf while the VPS file is grafana.example.net).
# 3. Do NOT put backup/`.bak` files inside sites-enabled/ — `include
#    sites-enabled/*` reads EVERY file there, and a backup carrying
#    `listen 80 default_server` makes `nginx -t` fail with
#    "a duplicate default server for 0.0.0.0:80". This happened once.
#    Put backups in /root/.
# 4. ALWAYS `nginx -t` before `systemctl reload nginx`. Reload does not drop
#    connections; restart does.
#
# ============================================================================
# THE NUMBERS AND WHY
# ============================================================================
# rate=20r/s, burst=40 nodelay, limit_conn 30 — the standard nginx figures for a
# ordinary website, identical to what already runs on Target-1.
#
# Deliberately NO ignoreip / IP allowlist. The dashboards (monitor, status,
# wazuh) are reached from anywhere including mobile; the caller IP changes, so a
# static allowlist would lock the owner out. Domain + SSL exist precisely for that.
#
# Deliberately NO path exception (e.g. for Grafana's /api/ds/query). The
# requirement was standard protection. If 429s appear when opening a dashboard,
# the only thing to change is the rate or burst number below — one line.
#
# Test: 60 rapid requests to status.example.net = 60x 302, zero 429. That is
# CORRECT: rate 20r/s + burst 40 absorbs 60 requests that finish in ~2 seconds.
# The limit triggers on scanner patterns (hundreds per second with no gap).

http {

	# per-IP rate limit (used by vhosts via limit_req / limit_conn)
	limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
	limit_conn_zone $binary_remote_addr zone=perconn:10m;

	##
	# Basic Settings
	##
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##
	# IMPORTANT: ONE log for ALL vhosts. There is no per-vhost access_log.
	# Consequence: fail2ban and detection can only see log lines, not which
	# vhost a request belonged to.
	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##
	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
