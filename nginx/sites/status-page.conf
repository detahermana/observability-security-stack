# Host-level nginx vhost (at /etc/nginx/sites-available/status on the VPS).
# NOT deployed automatically by CI/CD — reference/backup only, so the
# configuration can be replicated if the VPS is rebuilt. See the README section
# "Domain & SSL (access via subdomain)" for the reinstall steps.
#
# Note: the certificate below points to the "grafana.example.net" directory
# because certbot was run once for both domains (monitor + status) at the same
# time, producing a single SAN certificate whose lineage name comes from the
# first domain. This is normal and valid for status.example.net as well.
#
# RATE LIMIT (added): same as monitoring.conf, the zone is defined in
# nginx/nginx.conf. The sensitive-file block is installed too.
#
# BEHAVIOUR NOTE (verified): Uptime-Kuma is an SPA and returns 200 + index.html
# for EVERY unknown path — including `/.env` and `/.git/config`. So when testing
# the sensitive blocks here, `/.git/config` returns 200 and that is NOT a leak:
# there is no .git file on the server, the body is the SPA HTML. Any random path
# (e.g. /random-xyz) also returns 200 with the same HTML.

server {
    server_name status.example.net;

    location ~* \.(php|env|bak|old|save)$ { return 404; }
    location ~* \.(git|htaccess)$ { return 404; }

    location / {
		limit_req zone=perip burst=40 nodelay;
		limit_conn perconn 30;
        proxy_pass http://127.0.0.1:3033;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/grafana.example.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/grafana.example.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = status.example.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name status.example.net;
    return 404; # managed by Certbot


}
