# Host-level nginx vhost (at /etc/nginx/sites-available/9router on the VPS).
# Public: https://router.example.net -> container 9router (127.0.0.1:20128).
# NOT deployed automatically by CI/CD — reference/backup only.
#
# NOTE — this vhost was the SOURCE of Wazuh rule 31151 alert noise:
#   Internet scanners (largest being 203.0.113.15, 514x HTTP 400) guessed at
#   service endpoints exposed on this vhost: /v1/models, /api/v0/models,
#   /api/tags, /api/health, /console/api/setup, /admin/system/status,
#   /api/get-account. The UA was spoofed as Chrome. Because nginx previously had
#   NO rate limit, every 14x400 within 90 seconds fired rule 31151 (level 10)
#   -> Alertmanager -> Telegram. Rate limit + fail2ban below is what stopped it.
#
# client_max_body_size 200M and proxy_read_timeout 300s are kept: 9router is used
# as a gateway, so responses can stream for a long time.

server {

    server_name router.example.net;
	# reject sensitive-file access at the edge
	location ~* \.(php|env|bak|old|save)$ { return 404; }
	location ~* \.(git|htaccess)$ { return 404; }

    location / {
		limit_req zone=perip burst=40 nodelay;
		limit_conn perconn 30;
        proxy_pass http://127.0.0.1:20128;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

	client_max_body_size 200M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/router.example.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/router.example.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = router.example.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;

    server_name router.example.net;
    return 404; # managed by Certbot


}
