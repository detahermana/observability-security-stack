# Host-level nginx vhost (at /etc/nginx/sites-available/monitor on the VPS).
# NOT deployed automatically by CI/CD — reference/backup only, so the
# configuration can be replicated if the VPS is rebuilt. See the README section
# "Domain & SSL (access via subdomain)" for the reinstall steps.
#
# RATE LIMIT (added, already live in production):
#   `limit_req zone=perip burst=40 nodelay;` + `limit_conn perconn 30;`
#   The `perip` and `perconn` zones are defined in the `http {}` block of
#   nginx.conf — see nginx/nginx.conf in this repo. Without those zones,
#   `nginx -t` FAILS with "unknown limit_req_zone". The figures 20r/s burst=40
#   limit_conn 30 are the standard values, the same as used on Target-1.
#   NO ignoreip / allowlist: the dashboard is reached from mobile, IP changes.
#
# SENSITIVE-FILE BLOCK:
#   the regex locations below reject .php/.env/.bak/.old/.save/.git/.htaccess
#   with 404 at the edge, before touching the backend. Regex locations win over
#   a plain `location /`, so the order they are written in does not matter.

server {
    server_name grafana.example.net;
	# reject sensitive-file access at the edge
	location ~* \.(php|env|bak|old|save)$ { return 404; }
	location ~* \.(git|htaccess)$ { return 404; }

    location / {
		limit_req zone=perip burst=40 nodelay;
		limit_conn perconn 30;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/grafana.example.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/grafana.example.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = grafana.example.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name grafana.example.net;
    return 404; # managed by Certbot


}
