# Host-level nginx vhost (at /etc/nginx/sites-available/app-d.example.net on the VPS).
# Public: https://app-d.example.net -> container (127.0.0.1:3001).
# NOT deployed automatically by CI/CD — reference/backup only.
#
# NOTE: the sensitive-file block in this vhost existed EARLIER than the others
# (before the hardening pass), so this vhost is the origin of the pattern later
# reused across the other vhosts. The reason is visible in the log: scanners
# probed /.env, /.env.old, /.git/config, /info.php with a spoofed
# "Googlebot/2.1" UA and got 404.
#
# client_max_body_size 20G + client_body_timeout 21600s + proxy_request_buffering off
# are kept: this vhost is used for large file uploads. Consequence: the rate
# limit here must not be tightened, because one legitimate upload can take hours.

server {
    server_name app-d.example.net;

    location ~* \.(php|env|bak|old|save)$ { return 404; }
    location ~* \.(git|htaccess)$ { return 404; }

    location / {
		limit_req zone=perip burst=40 nodelay;
		limit_conn perconn 30;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	client_body_timeout 21600s;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        client_max_body_size 20G;
        proxy_request_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app-d.example.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app-d.example.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app-d.example.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app-d.example.net;
    return 404; # managed by Certbot


}
