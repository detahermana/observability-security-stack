# Host-level nginx vhost (at /etc/nginx/sites-available/ujk on the VPS).
# Public: https://app-c.example.net -> container (127.0.0.1:3000).
# NOT deployed automatically by CI/CD — reference/backup only.
#
# Rate limit + sensitive-file block added during the hardening pass.
# Zones `perip`/`perconn` are defined in nginx/nginx.conf.

server {
    server_name app-c.example.net;
	# reject sensitive-file access at the edge
	location ~* \.(php|env|bak|old|save)$ { return 404; }
	location ~* \.(git|htaccess)$ { return 404; }

    client_max_body_size 10m;

    location / {
		limit_req zone=perip burst=40 nodelay;
		limit_conn perconn 30;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app-c.example.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app-c.example.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app-c.example.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app-c.example.net;
    return 404; # managed by Certbot


}
