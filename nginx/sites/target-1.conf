# nginx vhost — Target-1 (site)
# Reference/backup of /etc/nginx/sites-available/target-1. NOT deployed
# automatically by CI/CD — the host nginx is outside the docker-compose scope.
#
# ===========================================================================
# CHANGE (security incident) — daily hardening
# ===========================================================================
# This vhost itself did not change. All the incident blocks were applied in
# Apache INSIDE the target-1-app container, not here, because the webshell and
# the leaked files are served by Apache directly (nginx only proxies). See
# docs/2026-09-22-*.md §1.
#
# Summary of the rules in effect on Target-1 (inside the target-1-app container,
# /etc/apache2/sites-enabled/000-default.conf):
#
#   <Directory /var/www/html/assets>
#       php_admin_flag engine off        <- the webshell becomes 403
#       SetHandler none
#       <FilesMatch "\.php$"> Require all denied
#   <LocationMatch "^/assets/(token\.json|tmp/)">
#       Require all denied               <- leaked token + record dumps become 403
#
# Why in Apache and not nginx: nginx only proxy_pass'es to 127.0.0.1:8080 (the
# container). A deny in nginx would work too, but duplicates the rule in two
# places (host nginx + container Apache) and is easy to forget. It is applied at
# the point where the files are actually served.
#
# ===========================================================================
# Rate limit (hardening, still in effect)
# ===========================================================================
# Zones are defined in /etc/nginx/conf.d/ratelimit.conf:
#   limit_req_zone  $binary_remote_addr zone=perip:10m    rate=20r/s;
#   limit_req_zone  $binary_remote_addr zone=login:10m    rate=5r/m;
#   limit_conn_zone $binary_remote_addr zone=connperip:10m;
#
# 20r/s = the standard nginx figure. Sizing: one network can NAT to one IP, so
# the number is deliberately loose. A normal page load = 5-15 assets; burst 40
# absorbs one page's parallel fetches.
#
# ⚠️ NOTE — NOT YET VERIFIED: this 20r/s rate limit has NOT been tested under
# heavy concurrent load. On Target-2 the rate limit was removed because many
# concurrent users arriving through a single NAT IP would hit 429 (see
# fail2ban/jail.d/target-2.local). Target-1 is not a peak-concurrency
# application, so the risk differs, but if it ever sees a large simultaneous
# workload, re-check this number first.

server {
    server_name target-1.example.org;

    location / {
        limit_req zone=perip burst=40 nodelay;
        limit_conn connperip 30;
        limit_req_status 429;
        limit_req_log_level warn;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
	proxy_set_header Accept-Encoding "";
	sub_filter_types text/html text/css application/javascript application/x-javascript text/javascript application/json;
	sub_filter_once off;
	sub_filter 'http://target-1.example.org' 'https://target-1.example.org';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/target-1.example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/target-1.example.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = target-1.example.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name target-1.example.org;
    return 404; # managed by Certbot


}
