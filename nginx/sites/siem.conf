# Host-level nginx vhost (at /etc/nginx/sites-available/wazuh on the VPS).
# NOT deployed automatically by CI/CD — reference/backup only, so the
# configuration can be replicated if the VPS is rebuilt. See the README section
# "Domain & SSL (access via subdomain)" for the reinstall steps.
#
# Backend: Wazuh Dashboard in the wazuh-dashboard container, port 5601.
#
# IMPORTANT notes about the Wazuh Dashboard behind a reverse proxy:
#   1. The dashboard serves HTTPS ONLY. `server.ssl.enabled: true` in
#      config/wazuh.dashboard/opensearch_dashboards.yml. So proxy_pass MUST use
#      https:// with proxy_ssl_verify off (internal self-signed cert, signed by
#      Wazuh's own root-ca, not a public CA).
#      Symptom if http:// is used: dashboard returns HTTP 000 / connection reset
#      and nginx logs "upstream sent no valid HTTP/1.0 header".
#   2. The dashboard serves the UI at ROOT `/`, not at `/dashboard`. Path `/`
#      returns 302 -> /app/login. Path `/dashboard` is an internal endpoint and
#      returns 401 — do NOT use it as the public URL.
#   3. WebSocket is required (Dev Tools Console, live updates). Handled by the
#      Upgrade/Connection "upgrade" headers below.
#
# NOTE on basic auth: deliberately NOT used on this vhost.
#   It was installed, then removed because:
#     (a) it added an extra browser popup before the Wazuh login page — two
#         different credentials for one site, confusing; and
#     (b) its interaction with the dashboard was fragile: the `Authorization`
#         header from basic auth was forwarded to the upstream and swallowed by
#         the dashboard's own authentication, making the login form always fail
#         (401) until that header was explicitly dropped.
#   Access control today: Wazuh's own login + TLS. If an edge layer is added
#   later, it MUST set `proxy_set_header Authorization "";` in location /, or the
#   login form will loop.
#
# RATE LIMIT (added): zones `perip`/`perconn` are defined in nginx/nginx.conf.
#   The sensitive-file block is installed. Verified behaviour: `/.git/config`
#   returns 401 (not 404) because Wazuh rejects the request before the regex
#   location is evaluated for an unauthenticated request. Not a leak.

server {
    server_name siem.example.net;
	# reject sensitive-file access at the edge
	location ~* \.(php|env|bak|old|save)$ { return 404; }
	location ~* \.(git|htaccess)$ { return 404; }


    location / {
		limit_req zone=perip burst=40 nodelay;
		limit_conn perconn 30;
        # https:// and not http:// — see note 1 above.
        proxy_pass https://127.0.0.1:5601;
        proxy_http_version 1.1;

        # Wazuh's internal cert is self-signed (signed by its own root-ca), so
        # verification against a public CA would always fail. Disable it — the
        # connection stays local (127.0.0.1), it does not leave the host.
        proxy_ssl_verify off;

        # REQUIRED: drop the edge Authorization header so it is not swallowed by
        # the dashboard's authentication. See the basic auth note above.
        proxy_set_header Authorization "";

        # WebSocket support — important for Dev Tools + Wazuh live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer settings — the Wazuh dashboard sometimes sends large responses
        # (search results, dashboard JSON)
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/siem.example.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/siem.example.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = siem.example.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name siem.example.net;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
