# nginx vhost — Target-2 (site)
# Reference/backup of /etc/nginx/sites-available/target-2. NOT deployed
# automatically by CI/CD — the host nginx is outside the docker-compose scope.
#
# ===========================================================================
# ⚠️ RATE LIMIT IS DELIBERATELY ABSENT FROM THIS VHOST
# ===========================================================================
# A rate limit was installed (limit_req zone=perip burst=40 + limit_conn
# connperip 30) and then REMOVED after doing the arithmetic. The reason:
#
#   Target-2 serves a large concurrent audience at peak times.
#   Users reach the DOMAIN from the SITE NETWORK
#   -> through the site router, NAT'd to a single public IP
#   -> nginx sees ONE IP for every user
#   many users x 1 page (~15 assets) = thousands of requests in seconds
#   rate limit 20 r/s = 1,200 requests/minute
#   -> most users get HTTP 429 = the task fails
#
# Owner's decision: drop the rate limit, rely on fail2ban. Priority: do not let
# the rate limit cause the task to fail for real users.
#
# Protection is still in effect: fail2ban jails target-2-scan +
# target-2-botsearch, with ignoreip containing 192.0.2.0/24 and 198.51.100.0/24 —
# so however many requests the users make, they CANNOT be banned. See
# fail2ban/jail.d/target-2.local.
#
# The zone is still defined in /etc/nginx/conf.d/ratelimit.conf but is NOT used
# by any vhost. A zone that is only defined has no effect; it was left so it can
# be used later if the pattern changes.
#
# Verified:
#   grep -rn "limit_req\|limit_conn" /etc/nginx/sites-enabled/   -> nothing
#
# ===========================================================================
# STILL OPEN — outside the infrastructure remit (recommendation to the owner)
# ===========================================================================
#   docker-proxy  0.0.0.0:8080   -> target-2-app
#   docker-proxy  0.0.0.0:3000   -> another service
#
# Both bind to 0.0.0.0, so reaching 192.0.2.7:8080 BYPASSES nginx entirely —
# fail2ban and the logs do not apply on that path. They should bind to
# 127.0.0.1 so all traffic must go through nginx. NOT changed, because port
# binding is the application's concern, not monitoring infrastructure's.
#
# Additional note for the owner: scanners hunted for /.env, /.git/config, and
# AI-agent credential paths (agent CLI auth files). All returned 404 (nothing
# leaked), but the target list was specific — a bot built to hunt AI coding-agent
# credentials. Make sure no such file exists inside the webroot.

server {
    server_name target-2.example.org;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/target-2.example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/target-2.example.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = target-2.example.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name target-2.example.org;
    return 404; # managed by Certbot


}
