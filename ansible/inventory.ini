# Inventory for the site monitoring infrastructure.
# Host groups: pve (main Proxmox hypervisor), pve2 (second Proxmox + PBS),
# target-1 & target-2 (site VMs).
# SSH keys use Windows-style paths — adjust to your Ansible environment.

[pve]
192.0.2.2 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_proxmox

# Second Proxmox host. Runs PBS as a VM and pbs-backup-monitor.sh for the
# backup metrics.
[pve2]
192.0.2.3 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_proxmox2

# Proxmox Backup Server (a VM on pve2). Interface nic0.
[pbs]
192.0.2.4 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_proxmox2_pbs

[target-1]
192.0.2.8 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_target-1

[target-2]
192.0.2.7 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_target-2

# Aggregate group for the whole site (target-1 + target-2, excluding pve/pve2).
[site:children]
target-1
target-2

# All Proxmox + PBS hosts (for tasks that apply on the hypervisor).
[proxmox:children]
pve
pve2

# Hosts that use ifupdown (/etc/network/interfaces) and need a route to the
# VPS WireGuard network via pve1. Unlike target-1/target-2, which use nmcli.
[ifupdown-hosts]
pve2
pbs

# Ansible settings (on a Windows host, consider using ssh_args).
[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10'
